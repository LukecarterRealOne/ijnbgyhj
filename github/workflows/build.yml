name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          # Uses the first .zip found in the repo; skips unzipping if the project is already unpacked
          if [ -f build.gradle ]; then
            echo "Project already unpacked."
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            ZIP=$(find . -maxdepth 2 -name '*.zip' | head -n 1)
            if [ -z "$ZIP" ]; then echo "No .zip found in the repo"; exit 1; fi
            echo "Unzipping $ZIP"
            mkdir -p /tmp/project
            unzip -q "$ZIP" -d /tmp/project
            GRADLE_FILE=$(find /tmp/project -name build.gradle | head -n 1)
            if [ -z "$GRADLE_FILE" ]; then echo "No build.gradle inside the zip"; exit 1; fi
            echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: dog-overlord-mc26.3-jar
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
          if-no-files-found: error
