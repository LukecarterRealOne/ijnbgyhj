name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find or unzip the project
        run: |
          if [ -f build.gradle ]; then
            echo "Project already unpacked in repo root."
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP=$(find . -maxdepth 2 -name '*.zip' | head -n 1)
            if [ -z "$ZIP" ]; then echo "No .zip and no build.gradle found in the repo"; exit 1; fi
            echo "Unzipping $ZIP"
            mkdir -p /tmp/project
            unzip -q "$ZIP" -d /tmp/project
            GRADLE_FILE=$(find /tmp/project -name build.gradle | head -n 1)
            if [ -z "$GRADLE_FILE" ]; then echo "No build.gradle inside the zip"; exit 1; fi
            PROJECT_DIR=$(dirname "$GRADLE_FILE")
          fi
          echo "Project dir: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.0

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --stacktrace

      - name: List built jars
        run: ls -la "$PROJECT_DIR/build/libs"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: dog-overlord-mc26.3-jar
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
          if-no-files-found: error
